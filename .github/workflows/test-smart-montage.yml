name: Test Smart Montage

on:
  push:
    branches: [main]
    paths:
      - 'tools/smart_montage/**'
      - 'documentary/examples/smart-montage.json'
      - 'tests/test_smart_montage.py'
      - 'SMART_MONTAGE.md'
      - '.github/workflows/test-smart-montage.yml'
  pull_request:
    paths:
      - 'tools/smart_montage/**'
      - 'documentary/examples/smart-montage.json'
      - 'tests/test_smart_montage.py'
      - 'SMART_MONTAGE.md'
      - '.github/workflows/test-smart-montage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/smart_montage/smart_montage.py
      - run: python -m unittest tests.test_smart_montage -v
