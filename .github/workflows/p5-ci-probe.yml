name: P5 CI Probe

on:
  push:
    branches:
      - ui/modern-p5-editor-shell
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe / Startup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner starts
        run: echo "GitHub Actions runner started successfully"
