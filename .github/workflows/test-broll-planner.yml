name: Test B-roll Planner

on:
  push:
    branches: [main]
    paths:
      - 'tools/broll_planner/**'
      - 'documentary/examples/broll-assets.json'
      - 'tests/test_broll_planner.py'
      - 'BROLL_PLANNER.md'
      - '.github/workflows/test-broll-planner.yml'
  pull_request:
    paths:
      - 'tools/broll_planner/**'
      - 'documentary/examples/broll-assets.json'
      - 'tests/test_broll_planner.py'
      - 'BROLL_PLANNER.md'
      - '.github/workflows/test-broll-planner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/broll_planner/broll_planner.py
      - run: python -m unittest tests.test_broll_planner -v
