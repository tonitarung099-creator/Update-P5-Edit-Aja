name: Test Documentary Toolkit

on:
  push:
    branches: [main]
    paths:
      - 'tools/documentary_toolkit/**'
      - 'documentary/**'
      - 'tests/test_documentary_toolkit.py'
      - 'DOCUMENTARY_TOOLKIT.md'
      - '.github/workflows/test-documentary-toolkit.yml'
  pull_request:
    paths:
      - 'tools/documentary_toolkit/**'
      - 'documentary/**'
      - 'tests/test_documentary_toolkit.py'
      - 'DOCUMENTARY_TOOLKIT.md'
      - '.github/workflows/test-documentary-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/documentary_toolkit/documentary_toolkit.py
      - run: python -m unittest tests.test_documentary_toolkit -v
