name: Test Creator Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'tools/creator_pipeline/**'
      - 'creator/**'
      - 'tests/test_creator_pipeline.py'
      - 'CREATOR_PIPELINE.md'
      - '.github/workflows/test-creator-pipeline.yml'
  pull_request:
    paths:
      - 'tools/creator_pipeline/**'
      - 'creator/**'
      - 'tests/test_creator_pipeline.py'
      - 'CREATOR_PIPELINE.md'
      - '.github/workflows/test-creator-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/creator_pipeline/creator_pipeline.py
      - run: python -m unittest tests.test_creator_pipeline -v
      - run: python tools/creator_pipeline/creator_pipeline.py creator/examples/documentary-pipeline.json --dry-run --workdir /tmp/update-p5-pipeline
