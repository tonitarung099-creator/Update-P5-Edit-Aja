name: Test Audio Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'tools/audio_intelligence/**'
      - 'tests/test_audio_intelligence.py'
      - 'AUDIO_INTELLIGENCE.md'
      - '.github/workflows/test-audio-intelligence.yml'
  pull_request:
    paths:
      - 'tools/audio_intelligence/**'
      - 'tests/test_audio_intelligence.py'
      - 'AUDIO_INTELLIGENCE.md'
      - '.github/workflows/test-audio-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/audio_intelligence/audio_intelligence.py
      - run: python -m unittest tests.test_audio_intelligence -v
