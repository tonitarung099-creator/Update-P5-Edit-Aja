name: Test Mask Effects

on:
  push:
    branches: [main]
    paths:
      - 'tools/mask_effects/**'
      - 'tests/test_mask_effects.py'
      - 'MASK_EFFECTS.md'
      - '.github/workflows/test-mask-effects.yml'
  pull_request:
    paths:
      - 'tools/mask_effects/**'
      - 'tests/test_mask_effects.py'
      - 'MASK_EFFECTS.md'
      - '.github/workflows/test-mask-effects.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/mask_effects/mask_effects.py
      - run: python -m unittest tests.test_mask_effects -v
