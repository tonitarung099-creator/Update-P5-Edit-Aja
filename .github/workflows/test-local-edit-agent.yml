name: Test Local Edit Agent

on:
  push:
    paths:
      - "tools/local_edit_agent/**"
      - "tests/test_local_edit_agent.py"
      - ".github/workflows/test-local-edit-agent.yml"
  pull_request:
    paths:
      - "tools/local_edit_agent/**"
      - "tests/test_local_edit_agent.py"
      - ".github/workflows/test-local-edit-agent.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest tests.test_local_edit_agent -v
