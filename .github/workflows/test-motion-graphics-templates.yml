name: Test Motion Graphics Templates

on:
  push:
    branches: [main]
    paths:
      - 'tools/motion_graphics_templates/**'
      - 'documentary/examples/motion-graphics-templates.json'
      - 'tests/test_motion_graphics_templates.py'
      - 'MOTION_GRAPHICS_TEMPLATES.md'
      - '.github/workflows/test-motion-graphics-templates.yml'
  pull_request:
    paths:
      - 'tools/motion_graphics_templates/**'
      - 'documentary/examples/motion-graphics-templates.json'
      - 'tests/test_motion_graphics_templates.py'
      - 'MOTION_GRAPHICS_TEMPLATES.md'
      - '.github/workflows/test-motion-graphics-templates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/motion_graphics_templates/motion_graphics_templates.py
      - run: python -m unittest tests.test_motion_graphics_templates -v
