name: Test Dialogue Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'tools/dialogue_intelligence/**'
      - 'tests/test_dialogue_intelligence.py'
      - 'DIALOGUE_INTELLIGENCE.md'
      - '.github/workflows/test-dialogue-intelligence.yml'
  pull_request:
    paths:
      - 'tools/dialogue_intelligence/**'
      - 'tests/test_dialogue_intelligence.py'
      - 'DIALOGUE_INTELLIGENCE.md'
      - '.github/workflows/test-dialogue-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/dialogue_intelligence/dialogue_intelligence.py
      - run: python -m unittest tests.test_dialogue_intelligence -v
