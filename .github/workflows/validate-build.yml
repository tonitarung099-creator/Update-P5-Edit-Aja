name: Validate Build Configuration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'build/**'
      - 'craft/editaja/editaja.py'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/test_build*.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'build/**'
      - 'craft/editaja/editaja.py'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/test_build*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile build helper Python
        run: python -m compileall -q scripts tests/test_build_configuration.py tests/test_build_manifest.py

      - name: Test build configuration and pinned manifest
        run: python -m unittest discover -s tests -p 'test_build*.py' -v

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3

      - name: Parse workflow YAML and collect PowerShell scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          scripts = []

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              workflow = yaml.safe_load(path.read_text(encoding='utf-8'))
              for job in workflow.get('jobs', {}).values():
                  for step in job.get('steps', []):
                      if step.get('shell') == 'pwsh' and 'run' in step:
                          scripts.append({
                              'name': f'{path}: {step["name"]}',
                              'script': step['run'],
                          })

          for path in sorted(Path('scripts/windows').glob('*.ps1')):
              scripts.append({
                  'name': str(path),
                  'script': path.read_text(encoding='utf-8'),
              })

          Path('workflow-scripts.json').write_text(
              json.dumps(scripts),
              encoding='utf-8',
          )
          print(f'Collected {len(scripts)} PowerShell scripts for syntax validation.')
          PY

      - name: Parse PowerShell syntax without executing build commands
        shell: pwsh
        run: |
          $scripts = Get-Content workflow-scripts.json -Raw | ConvertFrom-Json
          foreach ($entry in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput(
              $entry.script,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "$($entry.name): $($errors | Out-String)"
            }
          }
          Write-Host "Validated $($scripts.Count) PowerShell scripts."
