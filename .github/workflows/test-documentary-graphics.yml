name: Test Documentary Graphics

on:
  push:
    branches: [main]
    paths:
      - 'tools/documentary_graphics/**'
      - 'documentary/examples/japan-data-graphics.json'
      - 'tests/test_documentary_graphics.py'
      - 'DOCUMENTARY_GRAPHICS.md'
      - '.github/workflows/test-documentary-graphics.yml'
  pull_request:
    paths:
      - 'tools/documentary_graphics/**'
      - 'documentary/examples/japan-data-graphics.json'
      - 'tests/test_documentary_graphics.py'
      - 'DOCUMENTARY_GRAPHICS.md'
      - '.github/workflows/test-documentary-graphics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/documentary_graphics/documentary_graphics.py
      - run: python -m unittest tests.test_documentary_graphics -v
