name: Test Speech Backends

on:
  push:
    branches: [main]
    paths:
      - 'tools/speech_backends/**'
      - 'tests/test_whispercpp.py'
      - 'SPEECH_BACKENDS.md'
      - '.github/workflows/test-speech-backends.yml'
  pull_request:
    paths:
      - 'tools/speech_backends/**'
      - 'tests/test_whispercpp.py'
      - 'SPEECH_BACKENDS.md'
      - '.github/workflows/test-speech-backends.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/speech_backends/whispercpp.py
      - run: python -m unittest tests.test_whispercpp -v
