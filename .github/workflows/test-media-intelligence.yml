name: Test Media Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'tools/media_intelligence/**'
      - 'tests/test_media_intelligence.py'
      - 'MEDIA_INTELLIGENCE.md'
      - '.github/workflows/test-media-intelligence.yml'
  pull_request:
    paths:
      - 'tools/media_intelligence/**'
      - 'tests/test_media_intelligence.py'
      - 'MEDIA_INTELLIGENCE.md'
      - '.github/workflows/test-media-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile tools/media_intelligence/media_intelligence.py
      - name: Unit tests
        run: python -m unittest tests.test_media_intelligence -v
