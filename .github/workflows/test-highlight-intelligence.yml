name: Test Highlight Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'tools/highlight_intelligence/**'
      - 'tests/test_highlight_intelligence.py'
      - 'HIGHLIGHT_INTELLIGENCE.md'
      - '.github/workflows/test-highlight-intelligence.yml'
  pull_request:
    paths:
      - 'tools/highlight_intelligence/**'
      - 'tests/test_highlight_intelligence.py'
      - 'HIGHLIGHT_INTELLIGENCE.md'
      - '.github/workflows/test-highlight-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/highlight_intelligence/highlight_intelligence.py
      - run: python -m unittest tests.test_highlight_intelligence -v
