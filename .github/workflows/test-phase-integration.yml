name: Test Cross-Phase AI Edit Contract

on:
  push:
    branches: [main]
    paths:
      - 'tools/ai_edit/**'
      - 'tools/media_intelligence/**'
      - 'tools/caption_intelligence/**'
      - 'tools/audio_intelligence/**'
      - 'tests/test_phase_integration.py'
      - '.github/workflows/test-phase-integration.yml'
  pull_request:
    paths:
      - 'tools/ai_edit/**'
      - 'tools/media_intelligence/**'
      - 'tools/caption_intelligence/**'
      - 'tools/audio_intelligence/**'
      - 'tests/test_phase_integration.py'
      - '.github/workflows/test-phase-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify intelligence engines emit valid Phase 6 plans
        run: python -m unittest tests.test_phase_integration -v
