name: Extract Phase 5 source patch

on:
  push:
    paths:
      - '.github/workflows/extract-phase5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Phase 5 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, bz2, pathlib
          p = pathlib.Path("patches")
          parts = ["00","01","02","03","04.00","04.01","04.02","05.00","05.01","05.02"]
          encoded = "".join((p / f"phase5.patch.bz2.b64.{x}").read_text() for x in parts)
          data = bz2.decompress(base64.b64decode(encoded))
          pathlib.Path("phase5.patch").write_bytes(data)
          print(f"decoded {len(data)} bytes")
          PY
      - name: Upload decoded patch
        uses: actions/upload-artifact@v4
        with:
          name: phase5-decoded
          path: phase5.patch
          retention-days: 1
