name: Test Audio Backends

on:
  push:
    branches: [main]
    paths:
      - 'tools/audio_backends/**'
      - 'tests/test_deepfilternet.py'
      - 'AUDIO_BACKENDS.md'
      - '.github/workflows/test-audio-backends.yml'
  pull_request:
    paths:
      - 'tools/audio_backends/**'
      - 'tests/test_deepfilternet.py'
      - 'AUDIO_BACKENDS.md'
      - '.github/workflows/test-audio-backends.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/audio_backends/deepfilternet.py
      - run: python -m unittest tests.test_deepfilternet -v
