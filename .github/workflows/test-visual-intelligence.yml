name: Test Visual Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'tools/visual_intelligence/**'
      - 'tests/test_visual_intelligence.py'
      - 'VISUAL_INTELLIGENCE.md'
      - '.github/workflows/test-visual-intelligence.yml'
  pull_request:
    paths:
      - 'tools/visual_intelligence/**'
      - 'tests/test_visual_intelligence.py'
      - 'VISUAL_INTELLIGENCE.md'
      - '.github/workflows/test-visual-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/visual_intelligence/visual_intelligence.py
      - run: python -m unittest tests.test_visual_intelligence -v
