name: Test Speaker Captions

on:
  push:
    branches: [main]
    paths:
      - 'tools/speaker_captions/**'
      - 'caption/**'
      - 'tests/test_speaker_captions.py'
      - 'SPEAKER_CAPTIONS.md'
      - '.github/workflows/test-speaker-captions.yml'
  pull_request:
    paths:
      - 'tools/speaker_captions/**'
      - 'caption/**'
      - 'tests/test_speaker_captions.py'
      - 'SPEAKER_CAPTIONS.md'
      - '.github/workflows/test-speaker-captions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/speaker_captions/speaker_captions.py
      - run: python -m unittest tests.test_speaker_captions -v
