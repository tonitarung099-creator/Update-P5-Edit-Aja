name: Test Auto Ducking

on:
  push:
    branches: [main]
    paths:
      - 'tools/auto_ducking/**'
      - 'tests/test_auto_ducking.py'
      - 'AUTO_DUCKING.md'
      - '.github/workflows/test-auto-ducking.yml'
  pull_request:
    paths:
      - 'tools/auto_ducking/**'
      - 'tests/test_auto_ducking.py'
      - 'AUTO_DUCKING.md'
      - '.github/workflows/test-auto-ducking.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/auto_ducking/auto_ducking.py
      - run: python -m unittest tests.test_auto_ducking -v
