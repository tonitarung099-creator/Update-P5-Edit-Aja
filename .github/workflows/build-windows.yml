name: Build Update P5 Edit Aja for Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'patches/**'
      - 'branding/**'
      - 'scripts/**'
      - 'craft/**'
      - 'tools/film_context/**'
      - 'README.md'
      - 'BUILDING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-p5-edit-aja-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      UPSTREAM_COMMIT: c3d8a38c04470f6726b21485fc488f2cd2921654
      PHASE5_SHA256: 682be7bcb5afd875eb5f347ecd8f644be5fa1273e175c027ddd1d67491ac9a65
      PHASE6_SHA256: 975a7c253f125fc5350aec2f835c2eeed0d7c3b2a3cfe5766810d12244985f37
      PHASE12_SHA256: d8729f8d3cbe09e7818d5d5a4ab8cc690a45ac9f6982fdf98d0ded6732665652
      PHASE13_SHA256: 9826b9ec0a5252827cb34b8aa4f4b904a6bcf83c4ec302ad0e6893dd1bc195bc
      PHASE14_SHA256: 864aa6d7aeee21a965df407c1be2b9da7dde744cc065eccb698d7e5fdca7c248
      PHASE15_SHA256: a8dc28c9e679d65d0551f997515ee0603983e373d1ab545def8d7fd5593e217a
      CRAFT_ROOT: C:\CraftRoot

    steps:
      - name: Checkout Update P5 Edit Aja build repository
        uses: actions/checkout@v4

      - name: Reassemble and verify source patches
        shell: pwsh
        run: |
          python -c "import base64,bz2,hashlib,pathlib; p=pathlib.Path('patches'); n=['00','01','02','03','04.00','04.01','04.02','05.00','05.01','05.02']; s=''.join((p/f'phase5.patch.bz2.b64.{x}').read_text() for x in n); out=bz2.decompress(base64.b64decode(s)); h=hashlib.sha256(out).hexdigest(); print('Phase 5 SHA-256:',h); assert h=='$env:PHASE5_SHA256'; pathlib.Path('craft/editaja/phase5.patch').write_bytes(out)"
          python -c "import base64,bz2,hashlib,pathlib; p=pathlib.Path('patches/phase6-ai-edit-json.patch.bz2.b64'); out=bz2.decompress(base64.b64decode(p.read_text())); h=hashlib.sha256(out).hexdigest(); print('Phase 6 SHA-256:',h); assert h=='$env:PHASE6_SHA256'; pathlib.Path('craft/editaja/phase6.patch').write_bytes(out)"
          python -c "import base64,bz2,hashlib,pathlib; p=pathlib.Path('patches/phase12-local-edit-native.patch.bz2.b64'); out=bz2.decompress(base64.b64decode(p.read_text())); h=hashlib.sha256(out).hexdigest(); print('Phase 12 SHA-256:',h); assert h=='$env:PHASE12_SHA256'; pathlib.Path('craft/editaja/phase12.patch').write_bytes(out)"
          python -c "import base64,bz2,hashlib,pathlib; p=pathlib.Path('patches/phase13-local-edit-scene-undo.patch.bz2.b64'); out=bz2.decompress(base64.b64decode(p.read_text())); h=hashlib.sha256(out).hexdigest(); print('Phase 13 SHA-256:',h); assert h=='$env:PHASE13_SHA256'; pathlib.Path('craft/editaja/phase13.patch').write_bytes(out)"
          python -c "import base64,bz2,hashlib,pathlib; p=pathlib.Path('patches/phase14-local-edit-preview-history.patch.bz2.b64'); out=bz2.decompress(base64.b64decode(p.read_text())); h=hashlib.sha256(out).hexdigest(); print('Phase 14 SHA-256:',h); assert h=='$env:PHASE14_SHA256'; pathlib.Path('craft/editaja/phase14.patch').write_bytes(out)"
          python -c "import base64,bz2,hashlib,pathlib; p=pathlib.Path('patches/phase15-film-context-native.patch.bz2.b64'); out=bz2.decompress(base64.b64decode(p.read_text())); h=hashlib.sha256(out).hexdigest(); print('Phase 15 SHA-256:',h); assert h=='$env:PHASE15_SHA256'; pathlib.Path('craft/editaja/phase15.patch').write_bytes(out)"
          Copy-Item tools/film_context/film_context.py craft/editaja/film_context.txt -Force
          Copy-Item patches/build-fixes.patch craft/editaja/build-fixes.patch -Force
          Copy-Item branding/editaja-logo.png.b64 craft/editaja/editaja-logo.png.b64 -Force
          Copy-Item scripts/apply_branding.py craft/editaja/apply_branding.txt -Force

      - name: Reconstruct and verify corresponding source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force corresponding-source | Out-Null
          git -C corresponding-source init
          git -C corresponding-source remote add origin https://github.com/KDE/kdenlive.git
          git -C corresponding-source fetch --depth 1 origin $env:UPSTREAM_COMMIT
          git -C corresponding-source checkout --detach FETCH_HEAD
          git -C corresponding-source apply --ignore-space-change -p2 "$env:GITHUB_WORKSPACE\craft\editaja\phase5.patch"
          git -C corresponding-source apply --check "$env:GITHUB_WORKSPACE\patches\build-fixes.patch"
          git -C corresponding-source apply "$env:GITHUB_WORKSPACE\patches\build-fixes.patch"
          git -C corresponding-source apply --ignore-space-change -p1 "$env:GITHUB_WORKSPACE\craft\editaja\phase6.patch"
          git -C corresponding-source apply --ignore-space-change -p1 "$env:GITHUB_WORKSPACE\craft\editaja\phase12.patch"
          git -C corresponding-source apply --ignore-space-change -p1 "$env:GITHUB_WORKSPACE\craft\editaja\phase13.patch"
          git -C corresponding-source apply --ignore-space-change -p1 "$env:GITHUB_WORKSPACE\craft\editaja\phase14.patch"
          git -C corresponding-source apply --ignore-space-change -p1 "$env:GITHUB_WORKSPACE\craft\editaja\phase15.patch"
          New-Item -ItemType Directory -Force corresponding-source/data/scripts/filmcontext | Out-Null
          Copy-Item tools/film_context/film_context.py corresponding-source/data/scripts/filmcontext/film_context.py -Force
          python scripts/apply_branding.py corresponding-source --assets branding
          if (-not (Select-String -Path corresponding-source/src/main.cpp -Pattern 'i18n\("Update P5 Edit Aja"\)' -Quiet)) {
            throw 'Update P5 Edit Aja branding verification failed'
          }
          if (-not (Test-Path corresponding-source/src/aiassistant/aiassistantwidget.cpp)) {
            throw 'Phase 5 AI assistant source is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/aiassistant/aiassistantwidget.cpp -Pattern 'AI Edit JSON' -Quiet)) {
            throw 'Phase 6 AI Edit JSON UI is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/aiassistant/aiassistantwidget.cpp -Pattern 'Local Edit.*Lightweight' -Quiet)) {
            throw 'Phase 12 Local Edit UI is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/mainwindow.cpp -Pattern 'kdenlive_set_transform_keyframes' -Quiet)) {
            throw 'Phase 12 native Transform keyframe tool is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/mainwindow.cpp -Pattern 'kdenlive_get_scene_map' -Quiet)) {
            throw 'Phase 13 Scene Detection map tool is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/aiassistant/aiassistantwidget.cpp -Pattern 'beginMacro.*Local Edit: Zoom snapshots' -Quiet)) {
            throw 'Phase 13 Local Edit single-undo grouping is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/aiassistant/aiassistantwidget.cpp -Pattern 'Local Edit History' -Quiet)) {
            throw 'Phase 14 Local Edit History UI is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/mainwindow.cpp -Pattern 'creatorLocalEditPreview' -Quiet)) {
            throw 'Phase 14 Creator Workspace preview control is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/aiassistant/aiassistantwidget.cpp -Pattern 'Film Context' -Quiet)) {
            throw 'Phase 15 Film Context optional UI is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/aiassistant/aiassistantwidget.cpp -Pattern 'movie_search' -Quiet)) {
            throw 'Phase 15 Film Context agent tools are missing'
          }
          if (-not (Select-String -Path corresponding-source/src/aiassistant/aiassistantwidget.cpp -Pattern 'Build Visual Index \(Optional\)' -Quiet)) {
            throw 'Phase 15 optional visual index UI is missing'
          }
          if (-not (Select-String -Path corresponding-source/src/aiassistant/openaicompatibleagent.cpp -Pattern 'agent_image_paths' -Quiet)) {
            throw 'Phase 15 multi-keyframe vision handoff is missing'
          }
          if (-not (Test-Path corresponding-source/data/scripts/filmcontext/film_context.py)) {
            throw 'Phase 15 local Film Context backend is missing'
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Remove-Item -Recurse -Force corresponding-source/.git
          Compress-Archive -Path corresponding-source/* -DestinationPath artifacts/Update-P5-Edit-Aja-Source.zip -CompressionLevel Optimal

      - name: Bootstrap KDE Craft with MinGW x64
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and
            $_ -notmatch '(?i)\\Git\\bin$' -and
            $_ -notmatch '(?i)\\Git\\usr\\bin$' -and
            $_ -notmatch '(?i)\\mingw64\\bin$' -and
            $_ -notmatch '(?i)\\Strawberry\\c\\bin$'
          }) -join ';'

          New-Item -ItemType Directory -Force "$env:CRAFT_ROOT\download" | Out-Null
          $bootstrap = "$env:CRAFT_ROOT\download\CraftBootstrap.py"
          Invoke-WebRequest https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py -OutFile $bootstrap

          @'
          from pathlib import Path
          p = Path(r"C:\CraftRoot\download\CraftBootstrap.py")
          s = p.read_text(encoding="utf-8")
          needle = '            ("msvc2022", "cl"),\n            returnDefaultWithoutPrompt=args.use_defaults,'
          replacement = '            (None, "gcc"),\n            returnDefaultWithoutPrompt=args.use_defaults,'
          if needle not in s:
              raise SystemExit("Could not locate Craft Windows compiler default")
          p.write_text(s.replace(needle, replacement, 1), encoding="utf-8")
          '@ | Set-Content -Path patch_craft_bootstrap.py -Encoding UTF8

          python patch_craft_bootstrap.py
          python $bootstrap --prefix $env:CRAFT_ROOT --branch master --use-defaults

          $cfg = Join-Path $env:CRAFT_ROOT 'etc\CraftSettings.ini'
          if (-not (Test-Path $cfg)) {
            throw "Craft settings not found: $cfg"
          }
          $text = Get-Content $cfg -Raw
          $text = [regex]::Replace($text, '(?m)^ABI\s*=.*$', 'ABI = windows-gcc-x86_64')
          $text = [regex]::Replace($text, '(?m)^MakeProgram\s*=.*$', 'MakeProgram = mingw32-make')
          Set-Content -Path $cfg -Value $text -Encoding UTF8
          Get-Content $cfg | Select-String 'ABI|MakeProgram'

      - name: Patch Craft gettext MinGW libxml2 linking
        shell: pwsh
        run: |
          $gettextBlueprint = Join-Path $env:CRAFT_ROOT 'craft\blueprints\libs\gettext\gettext.py'
          if (-not (Test-Path $gettextBlueprint)) {
            throw "Craft gettext blueprint not found: $gettextBlueprint"
          }

          @'
          from pathlib import Path

          p = Path(r"C:\CraftRoot\craft\blueprints\libs\gettext\gettext.py")
          s = p.read_text(encoding="utf-8")
          needle = """    def configure(self):
        if not (
"""
          replacement = """    def configure(self):
        # Craft/MinGW: gnulib detects external libxml2 headers and LIBXML2,
        # but LTLIBXML2 is empty because Craft's CMake-built libxml2 has no
        # libtool .la metadata. gettext-tools then links libgettextsrc without
        # -lxml2 and fails with __imp_xml* undefined references.
        if CraftCore.compiler.isMinGW():
            libxml_m4 = self.sourceDir() / "gnulib-local" / "m4" / "libxml.m4"
            m4 = libxml_m4.read_text(encoding="utf-8")
            old = 'gl_cv_LTLIBXML="$LTLIBXML2 $LTLIBICONV"'
            new = 'gl_cv_LTLIBXML="$LIBXML2 $LTLIBICONV"'
            if old in m4:
                libxml_m4.write_text(m4.replace(old, new), encoding="utf-8")
            elif new not in m4:
                raise RuntimeError("Could not locate gettext libxml LTLIBXML assignment")
        if not (
"""
          if needle not in s:
              raise SystemExit("Could not locate gettext configure() hook")
          p.write_text(s.replace(needle, replacement, 1), encoding="utf-8")
          '@ | Set-Content -Path patch_gettext_libxml2.py -Encoding UTF8

          python patch_gettext_libxml2.py

          if (-not (Select-String -Path $gettextBlueprint -Pattern 'gl_cv_LTLIBXML.*LIBXML2' -Quiet)) {
            throw 'gettext MinGW libxml2 hotfix verification failed'
          }

      - name: Install Update P5 Edit Aja Craft blueprint
        shell: pwsh
        run: |
          $blueprintRoot = Get-ChildItem "$env:CRAFT_ROOT\etc\blueprints\locations" -Directory -Filter craft-blueprints-kde -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $blueprintRoot) {
            throw 'Could not locate the KDE Craft blueprint root'
          }
          $target = Join-Path $blueprintRoot.FullName 'kde\kdemultimedia\editaja'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item craft/editaja/* $target -Recurse -Force
          Write-Host "Update P5 Edit Aja blueprint: $target"
          Get-ChildItem $target

      - name: Build Update P5 Edit Aja
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and
            $_ -notmatch '(?i)\\Git\\bin$' -and
            $_ -notmatch '(?i)\\Git\\usr\\bin$' -and
            $_ -notmatch '(?i)\\mingw64\\bin$' -and
            $_ -notmatch '(?i)\\Strawberry\\c\\bin$'
          }) -join ';'
          python "$env:CRAFT_ROOT\craft\bin\craft.py" --ci-mode kde/kdemultimedia/editaja
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package Update P5 Edit Aja
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and
            $_ -notmatch '(?i)\\Git\\bin$' -and
            $_ -notmatch '(?i)\\Git\\usr\\bin$' -and
            $_ -notmatch '(?i)\\mingw64\\bin$' -and
            $_ -notmatch '(?i)\\Strawberry\\c\\bin$'
          }) -join ';'
          python "$env:CRAFT_ROOT\craft\bin\craft.py" --ci-mode --package kde/kdemultimedia/editaja
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect Windows package
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          if (Test-Path "$env:CRAFT_ROOT\tmp") {
            $packages = Get-ChildItem "$env:CRAFT_ROOT\tmp" -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in '.exe','.zip','.7z' -and
                ($_.Name -match 'edit.?aja' -or $_.Name -match 'editaja')
              }
            foreach ($p in $packages) {
              Copy-Item $p.FullName (Join-Path 'artifacts' $p.Name) -Force
            }
          }
          Get-ChildItem artifacts -File | Format-Table Name, Length

      - name: Upload Update P5 Edit Aja artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Update-P5-Edit-Aja-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
