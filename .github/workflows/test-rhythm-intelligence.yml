name: Test Rhythm Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'tools/rhythm_intelligence/**'
      - 'tests/test_rhythm_intelligence.py'
      - 'RHYTHM_INTELLIGENCE.md'
      - '.github/workflows/test-rhythm-intelligence.yml'
  pull_request:
    paths:
      - 'tools/rhythm_intelligence/**'
      - 'tests/test_rhythm_intelligence.py'
      - 'RHYTHM_INTELLIGENCE.md'
      - '.github/workflows/test-rhythm-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/rhythm_intelligence/rhythm_intelligence.py
      - run: python -m unittest tests.test_rhythm_intelligence -v
