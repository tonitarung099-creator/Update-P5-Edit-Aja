name: Test Segmentation Backends

on:
  push:
    branches: [main]
    paths:
      - 'tools/segmentation_backends/**'
      - 'segmentation/**'
      - 'tests/test_sam2_adapter.py'
      - 'SEGMENTATION_BACKENDS.md'
      - '.github/workflows/test-segmentation-backends.yml'
  pull_request:
    paths:
      - 'tools/segmentation_backends/**'
      - 'segmentation/**'
      - 'tests/test_sam2_adapter.py'
      - 'SEGMENTATION_BACKENDS.md'
      - '.github/workflows/test-segmentation-backends.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/segmentation_backends/sam2_video.py
      - run: python -m unittest tests.test_sam2_adapter -v
