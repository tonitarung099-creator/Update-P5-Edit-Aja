name: Test Beat Sync

on:
  push:
    branches: [main]
    paths:
      - 'tools/beat_sync/**'
      - 'tests/test_beat_sync.py'
      - 'BEAT_SYNC.md'
      - '.github/workflows/test-beat-sync.yml'
  pull_request:
    paths:
      - 'tools/beat_sync/**'
      - 'tests/test_beat_sync.py'
      - 'BEAT_SYNC.md'
      - '.github/workflows/test-beat-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/beat_sync/beat_sync.py
      - run: python -m unittest tests.test_beat_sync -v
