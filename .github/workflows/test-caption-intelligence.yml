name: Test Caption Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'tools/caption_intelligence/**'
      - 'tests/test_caption_intelligence.py'
      - 'CAPTION_INTELLIGENCE.md'
      - '.github/workflows/test-caption-intelligence.yml'
  pull_request:
    paths:
      - 'tools/caption_intelligence/**'
      - 'tests/test_caption_intelligence.py'
      - 'CAPTION_INTELLIGENCE.md'
      - '.github/workflows/test-caption-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/caption_intelligence/caption_intelligence.py
      - run: python -m unittest tests.test_caption_intelligence -v
