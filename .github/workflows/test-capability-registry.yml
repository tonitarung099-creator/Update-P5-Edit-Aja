name: Test Capability Registry

on:
  push:
    branches: [main]
    paths:
      - 'tools/capability_registry/**'
      - 'capabilities/**'
      - 'tests/test_capability_registry.py'
      - 'CAPABILITY_REGISTRY.md'
      - '.github/workflows/test-capability-registry.yml'
  pull_request:
    paths:
      - 'tools/capability_registry/**'
      - 'capabilities/**'
      - 'tests/test_capability_registry.py'
      - 'CAPABILITY_REGISTRY.md'
      - '.github/workflows/test-capability-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/capability_registry/capability_registry.py
      - run: python -m unittest tests.test_capability_registry -v
      - run: python tools/capability_registry/capability_registry.py --json || test $? -eq 3
