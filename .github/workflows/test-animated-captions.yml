name: Test Animated Captions

on:
  push:
    branches: [main]
    paths:
      - 'tools/animated_captions/**'
      - 'tests/test_animated_captions.py'
      - 'ANIMATED_CAPTIONS.md'
      - '.github/workflows/test-animated-captions.yml'
  pull_request:
    paths:
      - 'tools/animated_captions/**'
      - 'tests/test_animated_captions.py'
      - 'ANIMATED_CAPTIONS.md'
      - '.github/workflows/test-animated-captions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/animated_captions/animated_captions.py
      - run: python -m unittest tests.test_animated_captions -v
