name: Test Bad Take Review

on:
  push:
    branches: [main]
    paths:
      - 'tools/bad_take_review/**'
      - 'dialogue/**'
      - 'tests/test_bad_take_review.py'
      - 'BAD_TAKE_REVIEW.md'
      - '.github/workflows/test-bad-take-review.yml'
  pull_request:
    paths:
      - 'tools/bad_take_review/**'
      - 'dialogue/**'
      - 'tests/test_bad_take_review.py'
      - 'BAD_TAKE_REVIEW.md'
      - '.github/workflows/test-bad-take-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/bad_take_review/bad_take_review.py
      - run: python -m unittest tests.test_bad_take_review -v
